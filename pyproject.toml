[project]
name = "cvcy002"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abdulrahman1238", email = "bodyabokamar100@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "matplotlib>=3.10.9",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "scikit-learn>=1.7.2",
    "segmentation-models-pytorch>=0.5.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[project.scripts]
cvcy002 = "cvcy002:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
